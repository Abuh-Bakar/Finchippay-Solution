# SBOM Generation and Vulnerability Scanning
#
# Runs:
#   • On every push to main / develop (SBOM artifact upload)
#   • On every pull-request targeting main (vulnerability gate)
#   • Weekly on Sundays at 02:00 UTC (scheduled drift detection)
#
# Jobs:
#   1. generate-sbom  — Syft SBOM generation for frontend, backend, contracts
#   2. scan-sbom      — Grype vulnerability scan against generated SBOMs
#   3. scan-container — Trivy container image scan (main/tags only)

name: SBOM & Vulnerability Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

permissions:
  contents: read
  security-events: write   # for SARIF upload
  issues: write            # for opening vulnerability issues on schedule
  packages: read

jobs:
  # ─── SBOM Generation ────────────────────────────────────────────────────────
  generate-sbom:
    name: Generate SBOMs (Syft)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        id: syft

      # ── frontend ──
      - name: Generate frontend SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          artifact-name: sbom-frontend-cdx.json
          output-file: sbom/frontend.cdx.json
          format: cyclonedx-json

      - name: Generate frontend SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          artifact-name: sbom-frontend-spdx.json
          output-file: sbom/frontend.spdx.json
          format: spdx-json

      # ── backend ──
      - name: Generate backend SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          artifact-name: sbom-backend-cdx.json
          output-file: sbom/backend.cdx.json
          format: cyclonedx-json

      - name: Generate backend SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          artifact-name: sbom-backend-spdx.json
          output-file: sbom/backend.spdx.json
          format: spdx-json

      # ── contracts ──
      - name: Generate contracts SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./contracts/finchippay-contract
          artifact-name: sbom-contract-cdx.json
          output-file: sbom/contract.cdx.json
          format: cyclonedx-json

      - name: Generate contracts SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./contracts/finchippay-contract
          artifact-name: sbom-contract-spdx.json
          output-file: sbom/contract.spdx.json
          format: spdx-json

      # Upload all SBOMs as a single bundle artifact
      - name: Upload SBOM bundle
        uses: actions/upload-artifact@v4
        with:
          name: sbom-bundle-${{ github.sha }}
          path: sbom/
          retention-days: 90

  # ─── Dependency Vulnerability Scan ──────────────────────────────────────────
  scan-sbom:
    name: Vulnerability Scan (Grype)
    runs-on: ubuntu-latest
    needs: generate-sbom

    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM bundle
        uses: actions/download-artifact@v4
        with:
          name: sbom-bundle-${{ github.sha }}
          path: sbom/

      # Scan frontend SBOM — fail on CRITICAL
      - name: Scan frontend SBOM
        uses: anchore/scan-action@v6
        id: scan-frontend
        with:
          sbom: sbom/frontend.cdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: sarif

      - name: Upload frontend scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan-frontend.outputs.sarif }}
          category: grype-frontend

      # Scan backend SBOM — fail on CRITICAL
      - name: Scan backend SBOM
        uses: anchore/scan-action@v6
        id: scan-backend
        with:
          sbom: sbom/backend.cdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: sarif

      - name: Upload backend scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan-backend.outputs.sarif }}
          category: grype-backend

      # Scan contracts SBOM — fail on CRITICAL
      - name: Scan contracts SBOM
        uses: anchore/scan-action@v6
        id: scan-contracts
        with:
          sbom: sbom/contract.cdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: sarif

      - name: Upload contracts scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan-contracts.outputs.sarif }}
          category: grype-contracts

      # On scheduled runs, open an issue if new critical/high vulns found
      - name: Open vulnerability issue (scheduled only)
        if: ${{ github.event_name == 'schedule' && failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Security] New vulnerabilities detected — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Scheduled SBOM Vulnerability Scan Failure',
              '',
              `A weekly vulnerability scan on \`${{ github.ref_name }}\` detected **critical or high** vulnerabilities in one or more SBOMs.`,
              '',
              '### Action Required',
              '- Review the [SBOM scan workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.',
              '- Update affected dependencies and re-run the scan.',
              '- Close this issue once all critical/high findings are resolved.',
              '',
              '> This issue was opened automatically by the weekly SBOM scan schedule.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'sbom', 'vulnerability'],
            });

  # ─── Container Image Scan ───────────────────────────────────────────────────
  scan-container:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    # Only run on pushes to main / tags (images are only built on these refs)
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            dockerfile: backend/Dockerfile.prod
            context: backend
          - name: frontend
            dockerfile: frontend/Dockerfile.prod
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.component.name }} image (local scan only)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: false
          tags: finchippay-${{ matrix.component.name }}:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: finchippay-${{ matrix.component.name }}:scan
          format: sarif
          output: trivy-${{ matrix.component.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"           # fail on CRITICAL/HIGH
          ignore-unfixed: true      # skip vulns with no fix yet

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component.name }}.sarif
          category: trivy-${{ matrix.component.name }}
