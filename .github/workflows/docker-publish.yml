# .github/workflows/docker-publish.yml
# Build and push Docker images to GitHub Container Registry (ghcr.io)
# on every push to main, and on version tags (v*.*.*).
#
# Images published:
#   ghcr.io/finchippay/finchippay-backend:<tag>
#   ghcr.io/finchippay/finchippay-frontend:<tag>

name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/finchippay/finchippay-backend
  FRONTEND_IMAGE: ghcr.io/finchippay/finchippay-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      # ── Backend: build locally → scan → push ──────────────────────────────
      - name: Build backend image (local, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.prod
          push: false
          load: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Scan backend image (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # ── Frontend: build locally → scan → push ─────────────────────────────
      - name: Build frontend image (local, no push)
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: false
          load: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Scan frontend image (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      # ── Image SBOMs (SPDX) uploaded as build artifacts ────────────────────
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.1

      - name: Generate image SBOMs
        run: |
          mkdir -p sbom
          syft "${BACKEND_IMAGE}:sha-${{ github.sha }}"  -o spdx-json=sbom/backend-image.spdx.json
          syft "${FRONTEND_IMAGE}:sha-${{ github.sha }}" -o spdx-json=sbom/frontend-image.spdx.json

      - name: Upload image SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-sboms
          path: sbom/
          retention-days: 30
