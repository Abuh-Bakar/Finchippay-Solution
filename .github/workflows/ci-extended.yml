name: CI Extended

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL for load tests'
        required: false
        default: 'http://localhost:4000'

jobs:
  contracts:
    name: Soroban Contracts (Rust ${{ matrix.rust-channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-channel: ["stable", "nightly"]
    continue-on-error: ${{ matrix.rust-channel == 'nightly' }}
    defaults:
      run:
        working-directory: contracts/finchippay-contract
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-channel }}
          targets: wasm32v1-none
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/finchippay-contract/target
          key: ${{ runner.os }}-cargo-${{ matrix.rust-channel }}-${{ hashFiles('contracts/finchippay-contract/Cargo.lock') }}
      - run: cargo install cargo-audit
      - run: cargo audit
      - run: cargo check --target wasm32v1-none
      - run: cargo test
      - run: cargo test --test integration
      - if: ${{ matrix.rust-channel == 'stable' }}
        run: cargo build --target wasm32v1-none --release

  contract-fuzz:
    name: Contract Fuzz (libFuzzer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/finchippay-contract
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/finchippay-contract/target
          key: ${{ runner.os }}-cargo-fuzz-nightly-${{ hashFiles('contracts/finchippay-contract/Cargo.lock') }}
      - run: cargo install cargo-fuzz
      - run: cargo +nightly fuzz build --fuzz-dir fuzz
      - name: Fuzz targets (60s each)
        run: |
          for target in fuzz_target_1_parse_payment fuzz_target_2_escrow fuzz_target_3_multisig fuzz_target_4_batch_send open_stream claim_stream create_escrow claim_escrow create_multisig approve_multisig; do
            cargo +nightly fuzz run $target --fuzz-dir fuzz -- -max_total_time=60 -print_final_stats=1 || echo "::warning::$target found crashes"
          done
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: contracts/finchippay-contract/fuzz/artifacts/
          retention-days: 30

  contract-bindings:
    name: Contract Bindings (Drift Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32v1-none
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bindings-${{ hashFiles('contracts/finchippay-contract/Cargo.lock') }}
      - run: cargo install --locked stellar-cli
      - name: Generate bindings
        if: ${{ secrets.TESTNET_CONTRACT_ID != '' }}
        run: bash ../scripts/gen-contract-bindings.sh
        env:
          CONTRACT_ID: ${{ secrets.TESTNET_CONTRACT_ID }}
      - name: Check for drift
        if: ${{ secrets.TESTNET_CONTRACT_ID != '' }}
        run: |
          git diff --exit-code frontend/lib/contract-bindings/ \
            || (echo "ERROR: Generated contract bindings differ from committed snapshot." \
            && echo "Run 'bash scripts/gen-contract-bindings.sh' locally and commit the updated files." \
            && exit 1)
      - name: Skip bindings check (no CONTRACT_ID)
        if: ${{ secrets.TESTNET_CONTRACT_ID == '' }}
        run: echo "::notice::Skipping contract bindings drift check - TESTNET_CONTRACT_ID secret not set."

  compose:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend
        run: |
          mkdir -p data
          npm ci
          npm start &
          for i in $(seq 1 30); do
            curl -s http://localhost:4000/health && break
            [ "$i" -eq 30 ] && echo "Backend failed to start" && exit 1
            sleep 1
          done
        env:
          PORT: 4000
          NODE_ENV: test
          DB_PROVIDER: sqlite
          STELLAR_NETWORK: testnet
          HORIZON_URL: https://horizon-testnet.stellar.org
          JWT_SECRET: test-secret-for-e2e-testing-only
          ALLOWED_ORIGINS: "*"
          ANTHROPIC_API_KEY: test-key-for-ci
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_OUTPUT: export
          NEXT_PUBLIC_CONTRACT_ID: CCW67TSZV3SSS2HXMBQ52NVF3FB25GQ2G6E3BGLZ52B7W7TKG4E7SML2
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  lighthouse:
    name: Lighthouse & Axe a11y CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_CONTRACT_ID: CCW67TSZV3SSS2HXMBQ52NVF3FB25GQ2G6E3BGLZ52B7W7TKG4E7SML2
      - run: npm run test:a11y
      - run: npm run test:a11y:full
      - run: npx lhci autorun

  error-docs:
    name: Error Code Docs (Drift Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/generate-error-codes-doc.js --check

  validate:
    name: Validate Config & Env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required config files exist
        run: |
          MISSING=0
          for file in backend/.env.example frontend/.env.example .nvmrc sdk/package.json scripts/generate-sdk.sh scripts/fuzz-contract.sh; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              MISSING=1
            else
              echo "Found: $file"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
      - name: Validate root package.json
        run: |
          if [ -f package.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" && echo "package.json is valid JSON"
          fi
      - name: Check for hardcoded secrets
        run: |
          if grep -rE "sk-[a-zA-Z0-9]{32,}" \
            --include="*.{js,ts,json}" \
            --exclude-dir=.github \
            --exclude-dir=node_modules \
            --exclude-dir=__tests__ \
            --exclude-dir=e2e \
            . 2>/dev/null; then
            echo "::warning::Potential hardcoded API keys found. Review before merging."
          else
            echo "No suspicious hardcoded secrets detected"
          fi

  benchmark:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run benchmark 2>/dev/null || echo "Benchmarks not yet configured - skipping"
        continue-on-error: true
      - name: Compare with baseline
        run: |
          if [ -f ../benchmarks/current.json ] && [ -f ../benchmarks/base.json ]; then
            node ../scripts/compare-benchmarks.js ../benchmarks/base.json ../benchmarks/current.json
          else
            echo "No baseline benchmarks found - skipping comparison"
          fi
        continue-on-error: true

  sbom:
    name: SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.1
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin v0.87.0
      - name: Generate SBOMs
        run: |
          mkdir -p sbom
          syft dir:frontend                      -o spdx-json=sbom/frontend.spdx.json -o cyclonedx-json=sbom/frontend.cdx.json
          syft dir:backend                       -o spdx-json=sbom/backend.spdx.json  -o cyclonedx-json=sbom/backend.cdx.json
          syft dir:contracts/finchippay-contract -o spdx-json=sbom/contract.spdx.json -o cyclonedx-json=sbom/contract.cdx.json
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom/
          retention-days: 30
      - name: Scan SBOMs (fail on CRITICAL only)
        run: |
          for sbom in frontend backend contract; do
            echo "::group::Grype scan - $sbom"
            grype "sbom:sbom/${sbom}.cdx.json" --fail-on critical || echo "::warning::CRITICAL vulnerabilities found in $sbom"
            echo "::endgroup::"
          done
        continue-on-error: true

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: []
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          echo "Coverage reporting will be generated when jest --coverage runs in CI."
          echo "Frontend: frontend/coverage/lcov-report/"
          echo "Backend: backend/coverage/lcov-report/"
