name: CI Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  contract-bindings:
    name: Contract Bindings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bindings-${{ hashFiles('contracts/finchippay-contract/Cargo.lock') }}
      - run: cargo install --locked stellar-cli
      - name: Generate bindings
        if: ${{ secrets.TESTNET_CONTRACT_ID != '' }}
        run: bash ../scripts/gen-contract-bindings.sh
        env:
          CONTRACT_ID: ${{ secrets.TESTNET_CONTRACT_ID }}
      - name: Check drift
        if: ${{ secrets.TESTNET_CONTRACT_ID != '' }}
        run: |
          git diff --exit-code frontend/lib/contract-bindings/ \
            || (echo "ERROR: Generated contract bindings differ. Run scripts/gen-contract-bindings.sh and commit." && exit 1)
      - name: Skip (no CONTRACT_ID)
        if: ${{ secrets.TESTNET_CONTRACT_ID == '' }}
        run: echo "::notice::Skipping - TESTNET_CONTRACT_ID not set."

  error-docs:
    name: Error Code Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/generate-error-codes-doc.js --check

  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for file in backend/.env.example frontend/.env.example .nvmrc sdk/package.json scripts/generate-sdk.sh scripts/fuzz-contract.sh; do
            [ ! -f "$file" ] && echo "::error::Missing: $file" && MISSING=1 || echo "Found: $file"
          done
          [ "$MISSING" -eq 1 ] && exit 1
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" && echo "Valid JSON"
      - name: Scan for secrets
        run: |
          if grep -rE "sk-[a-zA-Z0-9]{32,}" --include="*.{js,ts,json}" --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=__tests__ --exclude-dir=e2e . 2>/dev/null; then
            echo "::warning::Potential hardcoded API keys found"
          else
            echo "Clean"
          fi

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: echo "Coverage reports from frontend/coverage/ and backend/coverage/"
