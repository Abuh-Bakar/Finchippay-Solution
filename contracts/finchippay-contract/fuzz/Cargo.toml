[package]
name = "finchippay-contract-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.finchippay-contract]
path = ".."

[dependencies.soroban-sdk]
version = "27.0.1"
features = ["testutils"]

[[bin]]
name = "open_stream"
path = "fuzz_targets/open_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "claim_stream"
path = "fuzz_targets/claim_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "create_escrow"
path = "fuzz_targets/create_escrow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "claim_escrow"
path = "fuzz_targets/claim_escrow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch_send"
path = "fuzz_targets/batch_send.rs"
test = false
doc = false
bench = false

[[bin]]
name = "create_multisig"
path = "fuzz_targets/create_multisig.rs"
test = false
doc = false
bench = false

[[bin]]
name = "approve_multisig"
path = "fuzz_targets/approve_multisig.rs"
test = false
doc = false
bench = false
